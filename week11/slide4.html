<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: Arial, sans-serif;
  background: #fff;
  padding: 40px;
}

.slide-title {
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 40px;
}

.flow-container {
  display: flex;
  justify-content: space-between;
}

.screen {
  border: 2px solid #000;
  padding: 20px;
  width: 22%;
  text-align: center;
}

.screen-title {
  font-weight: bold;
  margin-bottom: 10px;
}

.box {
  border: 1px solid #000;
  height: 120px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="slide-title">Wireframe Preview</div>

<div class="flow-container">

  <div class="screen">
    <div class="screen-title">Home Dashboard</div>
    <div class="box">Sleep Score</div>
    <div class="box">Environment Status</div>
    <div class="box">Start Routine Button</div>
  </div>

  <div class="screen">
    <div class="screen-title">Breathing Guide</div>
    <div class="box">Breathing Circle</div>
    <div class="box">Timer</div>
  </div>

  <div class="screen">
    <div class="screen-title">Insights</div>
    <div class="box">Sleep + Mood Cards</div>
    <div class="box">Adjust Settings</div>
  </div>

  <div class="screen">
    <div class="screen-title">Settings</div>
    <div class="box">Smart Features Toggles</div>
    <div class="box">Schedule Time</div>
  </div>

</div>

</body>
</html>
